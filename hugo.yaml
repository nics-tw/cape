# Hugo configuration file
title: DP

# import hextra as module
module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra
      version: v0.12.3

defaultContentLanguage: en
languages:
  en:
    label: English
    weight: 1
  # zh-tw:
  #   label: 繁體中文
  #   weight: 2

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

enableInlineShortcodes: true

outputs:
  home: [html, llms]
  page: [html, markdown]

menu:
  main:
    - name: News
      pageRef: /news
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Foodie
      pageRef: /foodie
      weight: 3
    - name: About
      pageRef: /about
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search

params:
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal
    contextMenu:
      enable: true

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/dp_logo_2_black.svg
      dark: images/dp_logo_2_white.svg
      link: /nics-dp
      width: 40
      height: 20

  footer:
    displayCopyright: true
    displayPoweredBy: false

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  editURL:
    enable: false
    # base: "https://github.com/imfing/hextra-starter-template/edit/main/content"

  search:
    enable: true
    type: flexsearch

  imageZoom:
    enable: true

  externalLinkDecoration: true
